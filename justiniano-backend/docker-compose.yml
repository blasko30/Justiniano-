services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: justiniano
      POSTGRES_PASSWORD: justiniano
      POSTGRES_DB: justiniano
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro   # DDL + índices + seeds, en orden
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justiniano"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://justiniano:justiniano@db:5432/justiniano
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
volumes:
  pgdata:
