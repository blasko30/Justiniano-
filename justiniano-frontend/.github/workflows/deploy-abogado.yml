name: Deploy abogado (Azure Static Web Apps)

on:
  push:
    branches: [main]
    paths:
      - "apps/abogado/**"
      - "packages/**"
      - ".github/workflows/deploy-abogado.yml"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias (workspaces)
        run: npm ci

      - name: Build
        run: npm run build:abogado
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Deploy a Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_ABOGADO }}
          action: upload
          app_location: apps/abogado/dist
          skip_app_build: true
